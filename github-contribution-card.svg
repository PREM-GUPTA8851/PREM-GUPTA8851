name: Update GitHub Contribution Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PREM-GUPTA8851
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import math
          from datetime import datetime, timezone

          username = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]

          # -----------------------------
          # GitHub GraphQL Query
          # -----------------------------
          query = """
          query($login: String!) {
            user(login: $login) {
              login
              name
              createdAt

              repositories(
                ownerAffiliations: OWNER
                first: 1
              ) {
                totalCount
              }

              contributionsCollection {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": username
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise Exception(result["errors"])

          user = result["data"]["user"]

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]
          repos = user["repositories"]["totalCount"]

          # -----------------------------
          # Joined GitHub years
          # -----------------------------
          created = datetime.fromisoformat(
              user["createdAt"].replace("Z", "+00:00")
          )

          now = datetime.now(timezone.utc)

          years = now.year - created.year

          if (now.month, now.day) < (created.month, created.day):
              years -= 1

          year_text = "year" if years == 1 else "years"

          # -----------------------------
          # Collect daily contributions
          # -----------------------------
          daily = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  daily.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          # Last 365 days
          daily = daily[-365:]

          # -----------------------------
          # Convert daily -> weekly
          # -----------------------------
          weekly = []

          for i in range(0, len(daily), 7):
              chunk = daily[i:i + 7]

              if not chunk:
                  continue

              weekly.append({
                  "date": chunk[0]["date"],
                  "count": sum(
                      item["count"] for item in chunk
                  )
              })

          # -----------------------------
          # Smooth the weekly data
          # -----------------------------
          values = [item["count"] for item in weekly]

          smoothed = []

          window = 3

          for i in range(len(values)):
              start = max(0, i - window // 2)
              end = min(
                  len(values),
                  i + window // 2 + 1
              )

              section = values[start:end]

              smoothed.append(
                  sum(section) / len(section)
              )

          # -----------------------------
          # SVG dimensions
          # 2x resolution
          # -----------------------------
          WIDTH = 1640
          HEIGHT = 480

          # -----------------------------
          # Graph position
          # -----------------------------
          GRAPH_X = 760
          GRAPH_Y = 105

          GRAPH_WIDTH = 760
          GRAPH_HEIGHT = 270

          BASE_Y = GRAPH_Y + GRAPH_HEIGHT

          # -----------------------------
          # Axis maximum
          # -----------------------------
          maximum = max(
              smoothed,
              default=1
          )

          axis_max = max(
              100,
              int(math.ceil(maximum / 100.0) * 100)
          )

          # -----------------------------
          # Convert values to points
          # -----------------------------
          points = []

          count_points = len(smoothed)

          for i, value in enumerate(smoothed):

              if count_points <= 1:
                  x = GRAPH_X
              else:
                  x = GRAPH_X + (
                      i / (count_points - 1)
                  ) * GRAPH_WIDTH

              y = BASE_Y - (
                  value / axis_max
              ) * GRAPH_HEIGHT

              y = max(
                  GRAPH_Y,
                  min(BASE_Y, y)
              )

              points.append((x, y))

          # -----------------------------
          # Smooth Bézier curve
          # -----------------------------
          def bezier_path(points):
              if not points:
                  return ""

              if len(points) == 1:
                  x, y = points[0]
                  return f"M {x:.2f},{y:.2f}"

              path = (
                  f"M {points[0][0]:.2f},"
                  f"{points[0][1]:.2f}"
              )

              for i in range(len(points) - 1):

                  p0 = points[i - 1] if i > 0 else points[i]
                  p1 = points[i]
                  p2 = points[i + 1]
                  p3 = (
                      points[i + 2]
                      if i + 2 < len(points)
                      else p2
                  )

                  c1x = p1[0] + (
                      p2[0] - p0[0]
                  ) / 6

                  c1y = p1[1] + (
                      p2[1] - p0[1]
                  ) / 6

                  c2x = p2[0] - (
                      p3[0] - p1[0]
                  ) / 6

                  c2y = p2[1] - (
                      p3[1] - p1[1]
                  ) / 6

                  path += (
                      f" C {c1x:.2f},{c1y:.2f}"
                      f" {c2x:.2f},{c2y:.2f}"
                      f" {p2[0]:.2f},{p2[1]:.2f}"
                  )

              return path

          line_path = bezier_path(points)

          # -----------------------------
          # Filled area path
          # -----------------------------
          area_path = (
              f"M {GRAPH_X},{BASE_Y} "
              + line_path
              + f" L {GRAPH_X + GRAPH_WIDTH},{BASE_Y} "
              + "Z"
          )

          # -----------------------------
          # Month labels
          # Only one label per month
          # Show every second month
          # -----------------------------
          month_labels = []

          seen_months = []

          for i, item in enumerate(weekly):

              date = datetime.strptime(
                  item["date"],
                  "%Y-%m-%d"
              )

              key = (
                  date.year,
                  date.month
              )

              if key not in seen_months:
                  seen_months.append(key)

          # Keep only every second month
          selected_months = seen_months[::2]

          for year, month in selected_months:

              index = None

              for i, item in enumerate(weekly):

                  date = datetime.strptime(
                      item["date"],
                      "%Y-%m-%d"
                  )

                  if (
                      date.year == year
                      and date.month == month
                  ):
                      index = i
                      break

              if index is None:
                  continue

              if count_points <= 1:
                  x = GRAPH_X
              else:
                  x = GRAPH_X + (
                      index / (count_points - 1)
                  ) * GRAPH_WIDTH

              label = (
                  f"{str(year)[2:]}/"
                  f"{month:02d}"
              )

              month_labels.append(
                  f'''
                  <text
                    x="{x:.1f}"
                    y="414"
                    fill="#9be7e7"
                    font-size="22"
                    font-family="Arial, sans-serif"
                    text-anchor="middle">
                    {label}
                  </text>
                  '''
              )

          month_labels_svg = "\n".join(
              month_labels
          )

          # -----------------------------
          # Y-axis labels
          # -----------------------------
          y_labels = []

          steps = axis_max // 100

          for value in range(
              0,
              axis_max + 1,
              100
          ):

              y = BASE_Y - (
                  value / axis_max
              ) * GRAPH_HEIGHT

              y_labels.append(
                  f'''
                  <text
                    x="1550"
                    y="{y + 7:.1f}"
                    fill="#9be7e7"
                    font-size="21"
                    font-family="Arial, sans-serif"
                    text-anchor="start">
                    {value}
                  </text>
                  '''
              )

          y_labels_svg = "\n".join(
              y_labels
          )

          # -----------------------------
          # SVG
          # -----------------------------
          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}">

            <rect
              x="0"
              y="0"
              width="{WIDTH}"
              height="{HEIGHT}"
              rx="18"
              fill="#12111f"/>

            <rect
              x="2"
              y="2"
              width="{WIDTH - 4}"
              height="{HEIGHT - 4}"
              rx="18"
              fill="none"
              stroke="#303044"
              stroke-width="3"/>

            <!-- Username -->
            <text
              x="70"
              y="85"
              fill="#ff3b9d"
              font-size="34"
              font-family="Arial, sans-serif"
              font-weight="600">
              {username}
            </text>

            <!-- Contributions -->
            <text
              x="70"
              y="165"
              fill="#ffe11a"
              font-size="30"
              font-family="Arial, sans-serif">
              ●
            </text>

            <text
              x="110"
              y="165"
              fill="#c9f5f5"
              font-size="29"
              font-family="Arial, sans-serif">
              {total:,} Contributions on GitHub
            </text>

            <!-- Public repos -->
            <text
              x="70"
              y="220"
              fill="#ffe11a"
              font-size="30"
              font-family="Arial, sans-serif">
              ▣
            </text>

            <text
              x="110"
              y="220"
              fill="#c9f5f5"
              font-size="29"
              font-family="Arial, sans-serif">
              {repos} Public Repos
            </text>

            <!-- Joined -->
            <text
              x="70"
              y="275"
              fill="#ffe11a"
              font-size="30"
              font-family="Arial, sans-serif">
              ◷
            </text>

            <text
              x="110"
              y="275"
              fill="#c9f5f5"
              font-size="29"
              font-family="Arial, sans-serif">
              Joined GitHub {years} {year_text} ago
            </text>

            <!-- Company -->
            <text
              x="70"
              y="330"
              fill="#ffe11a"
              font-size="30"
              font-family="Arial, sans-serif">
              ▦
            </text>

            <text
              x="110"
              y="330"
              fill="#c9f5f5"
              font-size="29"
              font-family="Arial, sans-serif">
              @Cognizant
            </text>

            <!-- Graph title -->
            <text
              x="1510"
              y="65"
              fill="#9be7e7"
              font-size="21"
              font-family="Arial, sans-serif"
              text-anchor="end">
              contributions in the last year
            </text>

            <!-- Baseline -->
            <line
              x1="{GRAPH_X}"
              y1="{BASE_Y}"
              x2="{GRAPH_X + GRAPH_WIDTH}"
              y2="{BASE_Y}"
              stroke="#8de6e6"
              stroke-width="2"/>

            <!-- Purple filled area -->
            <path
              d="{area_path}"
              fill="#a678f0"
              opacity="0.92"/>

            <!-- Smooth purple curve -->
            <path
              d="{line_path}"
              fill="none"
              stroke="#a678f0"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"/>

            <!-- Y axis -->
            {y_labels_svg}

            <!-- Months -->
            {month_labels_svg}

          </svg>
          '''

          with open(
              "github-contribution-card.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("===================================")
          print("Contribution card generated")
          print(f"Contributions : {total}")
          print(f"Public repos  : {repos}")
          print(f"GitHub years  : {years}")
          print("===================================")

      # -----------------------------
      # Commit generated SVG
      # -----------------------------
      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-contribution-card.svg

          git diff --cached --quiet || \
            git commit -m "Update GitHub contribution card"

          git push
