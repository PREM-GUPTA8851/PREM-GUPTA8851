name: Update GitHub Contribution Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PREM-GUPTA8851
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime

          username = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              login
              createdAt

              repositories(
                ownerAffiliations: OWNER
                first: 1
              ) {
                totalCount
              }

              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": username
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise Exception(result["errors"])

          user = result["data"]["user"]
          calendar = user["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]
          repos = user["repositories"]["totalCount"]

          # -----------------------------
          # GitHub account age
          # -----------------------------

          created = datetime.fromisoformat(
              user["createdAt"].replace("Z", "+00:00")
          )

          now = datetime.now(created.tzinfo)

          years = now.year - created.year

          if (now.month, now.day) < (created.month, created.day):
              years -= 1

          # -----------------------------
          # Collect daily contributions
          # -----------------------------

          daily = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  daily.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          # Last 365 days
          daily = daily[-365:]

          # -----------------------------
          # Convert to weekly totals
          # -----------------------------

          weekly = []

          for i in range(0, len(daily), 7):
              chunk = daily[i:i + 7]

              if not chunk:
                  continue

              weekly.append({
                  "date": chunk[0]["date"],
                  "count": sum(x["count"] for x in chunk)
              })

          max_count = max(
              [x["count"] for x in weekly],
              default=1
          )

          # -----------------------------
          # SVG dimensions
          # -----------------------------

          WIDTH = 1400
          HEIGHT = 400

          graph_x = 600
          graph_y = 105
          graph_width = 680
          graph_height = 190

          points = []

          for i, item in enumerate(weekly):

              x = graph_x + (
                  i / max(1, len(weekly) - 1)
              ) * graph_width

              y = graph_y + graph_height - (
                  item["count"] / max_count
              ) * graph_height

              points.append((x, y))

          # -----------------------------
          # Smooth-ish area graph
          # -----------------------------

          line_points = " ".join(
              f"{x:.2f},{y:.2f}"
              for x, y in points
          )

          area_points = (
              f"{graph_x},{graph_y + graph_height} "
              + line_points
              + f" {graph_x + graph_width},{graph_y + graph_height}"
          )

          # -----------------------------
          # Month labels
          # -----------------------------

          month_labels = ""

          previous_month = None

          for i, item in enumerate(weekly):

              date = datetime.strptime(
                  item["date"],
                  "%Y-%m-%d"
              )

              month = date.strftime("%b")

              if month != previous_month:

                  x = graph_x + (
                      i / max(1, len(weekly) - 1)
                  ) * graph_width

                  month_labels += f'''
                  <text
                    x="{x:.1f}"
                    y="335"
                    fill="#9de8e8"
                    font-size="15"
                    font-family="Arial, sans-serif"
                    text-anchor="middle">
                    {month}
                  </text>
                  '''

                  previous_month = month

          # -----------------------------
          # SVG
          # -----------------------------

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}">

            <rect
              width="{WIDTH}"
              height="{HEIGHT}"
              rx="10"
              fill="#12111f"/>

            <rect
              x="1"
              y="1"
              width="{WIDTH - 2}"
              height="{HEIGHT - 2}"
              rx="10"
              fill="none"
              stroke="#343344"
              stroke-width="2"/>

            <!-- Username -->

            <text
              x="50"
              y="65"
              fill="#ff3b9d"
              font-size="28"
              font-family="Arial, sans-serif"
              font-weight="500">
              {username}
            </text>

            <!-- Contributions -->

            <text
              x="50"
              y="125"
              fill="#ffe01b"
              font-size="21"
              font-family="Arial, sans-serif">
              ●
            </text>

            <text
              x="78"
              y="125"
              fill="#c9f5f5"
              font-size="20"
              font-family="Arial, sans-serif">
              {total:,} Contributions on GitHub
            </text>

            <!-- Public repos -->

            <text
              x="50"
              y="175"
              fill="#ffe01b"
              font-size="21"
              font-family="Arial, sans-serif">
              ▣
            </text>

            <text
              x="78"
              y="175"
              fill="#c9f5f5"
              font-size="20"
              font-family="Arial, sans-serif">
              {repos} Public Repos
            </text>

            <!-- Joined -->

            <text
              x="50"
              y="225"
              fill="#ffe01b"
              font-size="21"
              font-family="Arial, sans-serif">
              ◷
            </text>

            <text
              x="78"
              y="225"
              fill="#c9f5f5"
              font-size="20"
              font-family="Arial, sans-serif">
              Joined GitHub {years} years ago
            </text>

            <!-- Company -->

            <text
              x="50"
              y="275"
              fill="#ffe01b"
              font-size="21"
              font-family="Arial, sans-serif">
              ▦
            </text>

            <text
              x="78"
              y="275"
              fill="#c9f5f5"
              font-size="20"
              font-family="Arial, sans-serif">
              @Cognizant
            </text>

            <!-- Graph title -->

            <text
              x="1280"
              y="55"
              fill="#9de8e8"
              font-size="15"
              font-family="Arial, sans-serif"
              text-anchor="end">
              contributions in the last year
            </text>

            <!-- Baseline -->

            <line
              x1="{graph_x}"
              y1="{graph_y + graph_height}"
              x2="{graph_x + graph_width}"
              y2="{graph_y + graph_height}"
              stroke="#8de6e6"
              stroke-width="2"/>

            <!-- Filled area -->

            <polygon
              points="{area_points}"
              fill="#a678f0"
              opacity="0.98"/>

            <!-- Graph outline -->

            <polyline
              points="{line_points}"
              fill="none"
              stroke="#a678f0"
              stroke-width="3"
              stroke-linejoin="round"
              stroke-linecap="round"/>

            <!-- Y labels -->

            <text
              x="1300"
              y="{graph_y + 5}"
              fill="#9de8e8"
              font-size="14"
              font-family="Arial, sans-serif">
              {max_count}
            </text>

            <text
              x="1300"
              y="{graph_y + graph_height + 5}"
              fill="#9de8e8"
              font-size="14"
              font-family="Arial, sans-serif">
              0
            </text>

            <!-- Months -->

            {month_labels}

          </svg>
          '''

          with open(
              "github-contribution-card.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Contribution card generated successfully.")

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-contribution-card.svg

          git diff --cached --quiet || \
            git commit -m "Update GitHub contribution card"

          git push
